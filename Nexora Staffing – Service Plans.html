<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora Staffing – Service Plans</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9ebf7;--surface:#ffffff;--ink:#171a52;--muted:#565a8c;--line:#c9cdea;--gold:#f2b134;--gold-ink:#171a52;--tint:#fbe6b0;--dot:#171a52;--dot-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1230;--surface:#181c4a;--ink:#eceefc;--muted:#9fa4d6;--line:#2c3270;--gold:#f2b134;--gold-ink:#171a52;--tint:#3a3a52;--dot:#f2b134;--dot-ink:#171a52;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1230;--surface:#181c4a;--ink:#eceefc;--muted:#9fa4d6;--line:#2c3270;--gold:#f2b134;--gold-ink:#171a52;--tint:#3a3a52;--dot:#f2b134;--dot-ink:#171a52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:56px 20px 72px}
h1{font:800 clamp(34px,6vw,60px)/1 "Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 14px;max-width:14ch}
.lede{color:var(--muted);max-width:52ch;margin:0 0 40px}
.scroll{overflow-x:auto;padding-bottom:6px}
.grid{min-width:720px}
.row{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(4,minmax(110px,1fr));align-items:stretch}
.head{align-items:end;gap:0}
.intro{padding:0 18px 18px 0;color:var(--muted);font-size:14px;align-self:end}
.ph{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:calc(130px + var(--s)*44px);margin-left:-1px}
.ph.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.ph h2{font:800 20px "Bricolage Grotesque",Figtree,sans-serif;margin:0}
.ph .tag{font-size:13px;opacity:.8;margin:2px 0 0}
.ph .price{font:800 clamp(26px,3.4vw,38px) "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.02em;margin:14px 0 10px}
.ph button{border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:7px 12px;font:600 14px Figtree,sans-serif;cursor:pointer}
.ph button:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ph button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.all{background:var(--surface);border:1px solid var(--line);padding:16px 18px;font-size:15px}
.all b{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;margin-right:6px}
.all span{color:var(--muted)}
.grp{grid-column:1/-1;padding:22px 4px 8px;font:800 15px "Bricolage Grotesque",Figtree,sans-serif;border-bottom:1px solid var(--line)}
.grp small{font:400 13px Figtree,sans-serif;color:var(--muted);margin-left:8px}
.cell{border-left:1px solid var(--line);border-right:1px solid var(--line);margin-left:-1px;display:flex;align-items:center;justify-content:center;min-height:50px;background:var(--surface)}
.cell.on{background:var(--tint)}
.b{padding:12px 18px 12px 4px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.row.item .cell{border-bottom:1px solid var(--line)}
.dot{width:22px;height:22px;border-radius:50%;background:var(--dot);color:var(--dot-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.last .cell{border-radius:0 0 14px 14px}
.note{color:var(--muted);font-size:13px;margin-top:32px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pick how far we go with you.</h1>
  <p class="lede">Each plan builds on the one before it. Move right and more of the placement journey is handled for you.</p>
  <div class="scroll"><div class="grid" id="grid"></div></div>
  <p class="note">Plan names, prices and benefits are placeholders. Edit the data at the top of the script.</p>
</div>
<script>
// ===== EDIT THIS DATA =====
const plans=[
  {name:"Starter",tag:"Get set up",price:"$1,100"},
  {name:"Standard",tag:"Most chosen",price:"$2,100",gold:true},
  {name:"Premium",tag:"Priority placement",price:"$3,100"},
  {name:"Enterprise",tag:"Custom scope",price:"$10,000"}
];
const everyPlan=["Resume preparation","Profile review session","Job applications support","Dedicated recruiter","Interview preparation","Full-time / W2 marketing","Interview scheduling","Interview follow-up"];
// benefits listed by the plan where they first appear (0 = Starter ... 3 = Enterprise)
const unlocks=[
  ["Email + LinkedIn support"],
  ["1-on-1 job discussion","Chat support","Mock interview session","Live training with a tech expert","Placement guarantee"],
  ["1-on-1 mock interview","Interview assistance until placement","Personal recruiter"],
  []
];
// ===== RENDER =====
const g=document.getElementById("grid");
let h=`<div class="row head"><div class="intro">Benefits are grouped by the plan where they first appear.</div>`+
plans.map((p,i)=>`<div class="ph${p.gold?" gold":""}" style="--s:${i}"><div><h2>${p.name}</h2><p class="tag">${p.tag}</p></div><div><div class="price">${p.price}</div><button type="button">Select ${p.name}</button></div></div>`).join("")+`</div>`;
h+=`<div class="all"><b>Every plan includes</b><span>${everyPlan.join(", ")}.</span></div>`;
unlocks.forEach((list,t)=>{
  if(!list.length)return;
  h+=`<div class="row"><div class="grp">Starts at ${plans[t].name}<small>${t?"and everything above":"in all four plans"}</small></div></div>`;
  list.forEach((b,k)=>{
    const last=(t===unlocks.length-1||unlocks.slice(t+1).every(x=>!x.length))&&k===list.length-1;
    h+=`<div class="row item${last?" last":""}"><div class="b">${b}</div>`+plans.map((p,i)=>i>=t?`<div class="cell on"><span class="dot" role="img" aria-label="Included">&#10003;</span></div>`:`<div class="cell"><span class="sr" style="position:absolute;left:-9999px">Not included</span></div>`).join("")+`</div>`;
  });
});
g.innerHTML=h;
</script>
</body>
</html>

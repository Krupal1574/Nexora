<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-blog-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121623;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00d2c4;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-blog-1)"/>

  <!-- Grid -->
  <g opacity="0.05">
    <path d="M0 105 L1200 105 M0 210 L1200 210 M0 315 L1200 315 M0 420 L1200 420 M0 525 L1200 525" stroke="#00f2fe" stroke-width="0.5"/>
    <path d="M200 0 L200 630 M400 0 L400 630 M600 0 L600 630 M800 0 L800 630 M1000 0 L1000 630" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- Lightbulb icon -->
  <g transform="translate(600, 280)">
    <circle cx="0" cy="-40" r="60" fill="url(#icon-grad-1)" opacity="0.3"/>
    <circle cx="0" cy="-40" r="50" fill="none" stroke="url(#icon-grad-1)" stroke-width="3"/>
    <rect x="-20" y="20" width="40" height="30" rx="4" fill="url(#icon-grad-1)" opacity="0.5"/>
    <line x1="-25" y1="50" x2="25" y2="50" stroke="url(#icon-grad-1)" stroke-width="3"/>

    <!-- Light rays -->
    <g stroke="url(#icon-grad-1)" stroke-width="2.5" opacity="0.6">
      <line x1="-80" y1="-40" x2="-95" y2="-40"/>
      <line x1="80" y1="-40" x2="95" y2="-40"/>
      <line x1="0" y1="-100" x2="0" y2="-115"/>
      <line x1="-57" y1="-83" x2="-68" y2="-94"/>
      <line x1="57" y1="-83" x2="68" y2="-94"/>
    </g>
  </g>

  <!-- Category label -->
  <text x="600" y="480" text-anchor="middle" fill="#00f2fe" font-size="24" font-weight="600" font-family="Space Grotesk, sans-serif">CAREER TIPS</text>

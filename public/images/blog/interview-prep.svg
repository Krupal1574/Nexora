<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-blog-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e1520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00d2c4;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-blog-3)"/>

  <!-- Grid -->
  <g opacity="0.05">
    <path d="M0 105 L1200 105 M0 315 L1200 315 M0 525 L1200 525" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- Checklist -->
  <g transform="translate(500, 200)">
    <rect x="0" y="0" width="200" height="220" rx="6" fill="none" stroke="url(#icon-grad-3)" stroke-width="2.5"/>

    <g stroke="url(#icon-grad-3)" stroke-width="3" fill="none">
      <path d="M 30,50 L 45,65 L 75,35"/>
      <path d="M 30,110 L 45,125 L 75,95"/>
      <path d="M 30,170 L 45,185 L 75,155"/>
    </g>

    <g opacity="0.5">
      <line x1="95" y1="50" x2="170" y2="50" stroke="#00f2fe" stroke-width="2"/>
      <line x1="95" y1="110" x2="170" y2="110" stroke="#00f2fe" stroke-width="2"/>
      <line x1="95" y1="170" x2="170" y2="170" stroke="#00f2fe" stroke-width="2"/>
    </g>
  </g>

  <!-- Question marks -->
  <g fill="#00f2fe" opacity="0.3" font-size="42" font-family="Space Grotesk, sans-serif" font-weight="bold">
    <text x="350" y="300">?</text>
    <text x="780" y="350">?</text>
  </g>

  <!-- Category label -->
  <text x="600" y="520" text-anchor="middle" fill="#00f2fe" font-size="24" font-weight="600" font-family="Space Grotesk, sans-serif">INTERVIEW PREP</text>
</svg>

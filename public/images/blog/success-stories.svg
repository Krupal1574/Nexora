<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-blog-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10171f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d2c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-blog-4)"/>

  <!-- Trophy/Success icon -->
  <g transform="translate(600, 280)">
    <!-- Trophy cup -->
    <path d="M -60,-50 L -50,-80 L 50,-80 L 60,-50 L 50,20 L -50,20 Z" fill="url(#icon-grad-4)" opacity="0.7" filter="url(#star-glow)"/>
    <path d="M -55,-50 L -45,-75 L 45,-75 L 55,-50 L 45,15 L -45,15 Z" fill="#121623"/>

    <!-- Base -->
    <rect x="-40" y="20" width="80" height="15" rx="3" fill="url(#icon-grad-4)" opacity="0.7"/>
    <rect x="-50" y="35" width="100" height="12" rx="4" fill="url(#icon-grad-4)"/>

    <!-- Handles -->
    <path d="M -60,-40 Q -90,-40 -90,-10" stroke="url(#icon-grad-4)" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 60,-40 Q 90,-40 90,-10" stroke="url(#icon-grad-4)" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Star on trophy -->
    <path d="M 0,-45 L 6,-30 L 22,-30 L 9,-20 L 15,-5 L 0,-15 L -15,-5 L -9,-20 L -22,-30 L -6,-30 Z" fill="#00f2fe" opacity="0.8"/>
  </g>

  <!-- Decorative stars -->
  <g opacity="0.5">
    <circle cx="450" cy="200" r="3" fill="#00f2fe"/>
    <circle cx="750" cy="230" r="3" fill="#00d2c4"/>
    <circle cx="500" cy="400" r="2.5" fill="#00f2fe"/>
    <circle cx="700" cy="380" r="2.5" fill="#00d2c4"/>
  </g>

  <!-- Category label -->
  <text x="600" y="500" text-anchor="middle" fill="url(#icon-grad-4)" font-size="24" font-weight="600" font-family="Space Grotesk, sans-serif">SUCCESS STORIES</text>
</svg>

<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1422;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="linkedin-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2c4;stop-opacity:1" />
    </linearGradient>
    <filter id="linkedin-glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-linkedin)"/>

  <!-- Grid -->
  <g opacity="0.06">
    <path d="M0 100 L800 100 M0 200 L800 200 M0 300 L800 300 M0 400 L800 400 M0 500 L800 500" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- Glow -->
  <circle cx="400" cy="300" r="220" fill="#00f2fe" opacity="0.05" filter="url(#linkedin-glow)"/>

  <!-- Profile card -->
  <g transform="translate(250, 180)">
    <rect x="0" y="0" width="300" height="240" rx="8" fill="#121623" stroke="url(#linkedin-gradient)" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="240" rx="8" fill="#00f2fe" opacity="0.02"/>

    <!-- Profile picture -->
    <circle cx="60" cy="50" r="30" fill="url(#linkedin-gradient)" opacity="0.4"/>
    <circle cx="60" cy="50" r="25" fill="#0d1422"/>

    <!-- Profile lines -->
    <line x1="110" y1="35" x2="260" y2="35" stroke="#00f2fe" stroke-width="3" opacity="0.8"/>
    <line x1="110" y1="52" x2="220" y2="52" stroke="#00d2c4" stroke-width="2" opacity="0.6"/>
    <line x1="110" y1="66" x2="240" y2="66" stroke="#00f2fe" stroke-width="1.5" opacity="0.4"/>

    <!-- Content sections -->
    <g opacity="0.3">
      <line x1="20" y1="110" x2="100" y2="110" stroke="#00f2fe" stroke-width="2"/>
      <line x1="20" y1="125" x2="270" y2="125" stroke="#00f2fe" stroke-width="1"/>
      <line x1="20" y1="138" x2="250" y2="138" stroke="#00f2fe" stroke-width="1"/>

      <line x1="20" y1="165" x2="110" y2="165" stroke="#00f2fe" stroke-width="2"/>
      <line x1="20" y1="180" x2="260" y2="180" stroke="#00f2fe" stroke-width="1"/>
      <line x1="20" y1="193" x2="240" y2="193" stroke="#00f2fe" stroke-width="1"/>
      <line x1="20" y1="206" x2="265" y2="206" stroke="#00f2fe" stroke-width="1"/>
    </g>
  </g>

  <!-- Network nodes -->
  <g opacity="0.4">
    <circle cx="180" cy="300" r="8" fill="#00f2fe"/>
    <circle cx="620" cy="280" r="8" fill="#00d2c4"/>
    <circle cx="620" cy="360" r="8" fill="#00f2fe"/>

    <line x1="250" y1="300" x2="180" y2="300" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="550" y1="310" x2="620" y2="280" stroke="#00d2c4" stroke-width="1.5"/>
    <line x1="550" y1="350" x2="620" y2="360" stroke="#00f2fe" stroke-width="1.5"/>
  </g>

  <!-- Stats indicators -->
  <g transform="translate(320, 470)">
    <text x="0" y="0" fill="#00f2fe" font-size="18" font-weight="bold" font-family="Space Grotesk, sans-serif">Profile Views</text>
    <text x="0" y="25" fill="url(#linkedin-gradient)" font-size="28" font-weight="bold" font-family="Space Grotesk, sans-serif">↑ 350%</text>
  </g>
</svg>

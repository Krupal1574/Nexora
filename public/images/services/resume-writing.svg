<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-resume-svc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pen-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2c4;stop-opacity:1" />
    </linearGradient>
    <filter id="resume-glow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg-resume-svc)"/>

  <!-- Grid -->
  <g opacity="0.06">
    <path d="M0 100 L800 100 M0 200 L800 200 M0 300 L800 300 M0 400 L800 400 M0 500 L800 500" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- Glow -->
  <ellipse cx="400" cy="300" rx="250" ry="200" fill="#00f2fe" opacity="0.04" filter="url(#resume-glow)"/>

  <!-- Document -->
  <g transform="translate(280, 150)">
    <rect x="0" y="0" width="240" height="320" rx="6" fill="#121623" stroke="#00f2fe" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="320" rx="6" fill="#00f2fe" opacity="0.02"/>

    <!-- Header -->
    <rect x="15" y="15" width="210" height="45" rx="3" fill="url(#pen-gradient)" opacity="0.2"/>
    <line x1="30" y1="32" x2="140" y2="32" stroke="#00f2fe" stroke-width="2.5" opacity="0.7"/>
    <line x1="30" y1="45" x2="110" y2="45" stroke="#00d2c4" stroke-width="1.5" opacity="0.5"/>

    <!-- Content lines -->
    <g opacity="0.4">
      <line x1="15" y1="80" x2="80" y2="80" stroke="#00f2fe" stroke-width="2"/>
      <line x1="15" y1="95" x2="210" y2="95" stroke="#00f2fe" stroke-width="1.2"/>
      <line x1="15" y1="107" x2="195" y2="107" stroke="#00f2fe" stroke-width="1.2"/>

      <line x1="15" y1="135" x2="90" y2="135" stroke="#00f2fe" stroke-width="2"/>
      <line x1="15" y1="150" x2="205" y2="150" stroke="#00f2fe" stroke-width="1.2"/>
      <line x1="15" y1="162" x2="190" y2="162" stroke="#00f2fe" stroke-width="1.2"/>
      <line x1="15" y1="174" x2="200" y2="174" stroke="#00f2fe" stroke-width="1.2"/>

      <line x1="15" y1="200" x2="85" y2="200" stroke="#00f2fe" stroke-width="2"/>
      <line x1="15" y1="215" x2="195" y2="215" stroke="#00f2fe" stroke-width="1.2"/>
      <line x1="15" y1="227" x2="210" y2="227" stroke="#00f2fe" stroke-width="1.2"/>

      <line x1="15" y1="255" x2="75" y2="255" stroke="#00f2fe" stroke-width="2"/>
      <line x1="15" y1="270" x2="150" y2="270" stroke="#00f2fe" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Pen -->
  <g transform="translate(520, 350) rotate(-45)">
    <rect x="-8" y="-50" width="16" height="100" rx="3" fill="url(#pen-gradient)" filter="url(#resume-glow)"/>
    <path d="M -8,50 L 0,65 L 8,50 Z" fill="#00d2c4"/>
    <rect x="-8" y="-55" width="16" height="10" fill="#00f2fe"/>
  </g>

  <!-- Sparkles -->
  <g opacity="0.6">
    <circle cx="600" cy="200" r="2" fill="#00f2fe"/>
    <circle cx="650" cy="240" r="2" fill="#00d2c4"/>
    <circle cx="620" cy="280" r="2" fill="#00f2fe"/>
  </g>
</svg>

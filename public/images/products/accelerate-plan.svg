<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium accelerate/growth visual -->
  <defs>
    <linearGradient id="bg-accel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1624;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="growth-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2c4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="25" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg-accel)"/>

  <!-- Grid -->
  <g opacity="0.06">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300 M0 400 L1200 400 M0 500 L1200 500 M0 600 L1200 600 M0 700 L1200 700" stroke="#00f2fe" stroke-width="0.5"/>
    <path d="M100 0 L100 800 M200 0 L200 800 M300 0 L300 800 M400 0 L400 800 M500 0 L500 800 M600 0 L600 800 M700 0 L700 800 M800 0 L800 800 M900 0 M900 800 M1000 0 L1000 800 M1100 0 L1100 800" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- Glowing background elements -->
  <circle cx="250" cy="300" r="180" fill="#00f2fe" opacity="0.08" filter="url(#glow-strong)"/>
  <circle cx="950" cy="500" r="200" fill="#00d2c4" opacity="0.08" filter="url(#glow-strong)"/>

  <!-- Upward trending arrow/growth chart -->
  <g transform="translate(400, 450)">
    <!-- Base line -->
    <line x1="0" y1="0" x2="400" y2="0" stroke="#1a202c" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-300" stroke="#1a202c" stroke-width="2"/>

    <!-- Growth bars -->
    <rect x="40" y="-80" width="50" height="80" fill="#00f2fe" opacity="0.3" rx="4"/>
    <rect x="120" y="-140" width="50" height="140" fill="#00f2fe" opacity="0.5" rx="4"/>
    <rect x="200" y="-200" width="50" height="200" fill="#00f2fe" opacity="0.7" rx="4"/>
    <rect x="280" y="-280" width="50" height="280" fill="url(#growth-gradient)" rx="4"/>

    <!-- Glowing trend line -->
    <path d="M 0,0 L 65,-80 L 145,-140 L 225,-200 L 305,-280" stroke="url(#growth-gradient)" stroke-width="3" fill="none" filter="url(#glow-strong)"/>

    <!-- Data points -->
    <circle cx="65" cy="-80" r="6" fill="#00f2fe"/>
    <circle cx="145" cy="-140" r="6" fill="#00f2fe"/>
    <circle cx="225" cy="-200" r="6" fill="#00d2c4"/>
    <circle cx="305" cy="-280" r="8" fill="#00f2fe" filter="url(#glow-strong)"/>

    <!-- Upward arrow -->
    <g transform="translate(305, -280)">
      <path d="M 0,-30 L 0,0" stroke="#00f2fe" stroke-width="3"/>
      <path d="M 0,-30 L -8,-20 M 0,-30 L 8,-20" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Percentage indicator -->
  <g transform="translate(850, 200)">
    <circle cx="0" cy="0" r="60" fill="#121623" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="0" cy="0" r="55" fill="#00f2fe" opacity="0.1"/>
    <text x="0" y="10" text-anchor="middle" fill="#00f2fe" font-size="32" font-weight="bold" font-family="Space Grotesk, sans-serif">+40%</text>
  </g>

  <!-- Decorative elements -->
  <g opacity="0.15" stroke="#00f2fe" fill="none">
    <circle cx="150" cy="150" r="40" stroke-width="1.5"/>
    <rect x="950" y="650" width="100" height="80" rx="8" stroke-width="1.5"/>
  </g>
</svg>

<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Resume optimization visual -->
  <defs>
    <linearGradient id="bg-resume" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doc-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121623;stop-opacity:1" />
    </linearGradient>
    <filter id="doc-glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg-resume)"/>

  <!-- Grid -->
  <g opacity="0.06">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300 M0 400 L1200 400 M0 500 L1200 500 M0 600 L1200 600 M0 700 L1200 700" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- Glow -->
  <ellipse cx="600" cy="400" rx="300" ry="300" fill="#00f2fe" opacity="0.05" filter="url(#doc-glow)"/>

  <!-- Document/Resume -->
  <g transform="translate(450, 180)">
    <!-- Paper -->
    <rect x="0" y="0" width="300" height="420" rx="8" fill="url(#doc-gradient)" stroke="#00f2fe" stroke-width="2" filter="url(#doc-glow)"/>
    <rect x="0" y="0" width="300" height="420" rx="8" fill="#00f2fe" opacity="0.03"/>

    <!-- Header section -->
    <rect x="20" y="20" width="260" height="60" rx="4" fill="#00f2fe" opacity="0.15"/>
    <line x1="40" y1="40" x2="180" y2="40" stroke="#00f2fe" stroke-width="3" opacity="0.7"/>
    <line x1="40" y1="55" x2="140" y2="55" stroke="#00d2c4" stroke-width="2" opacity="0.5"/>

    <!-- Content lines -->
    <g opacity="0.4">
      <line x1="20" y1="110" x2="100" y2="110" stroke="#00f2fe" stroke-width="2.5"/>
      <line x1="20" y1="130" x2="260" y2="130" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="20" y1="145" x2="240" y2="145" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="20" y1="160" x2="250" y2="160" stroke="#00f2fe" stroke-width="1.5"/>

      <line x1="20" y1="190" x2="120" y2="190" stroke="#00f2fe" stroke-width="2.5"/>
      <line x1="20" y1="210" x2="260" y2="210" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="20" y1="225" x2="230" y2="225" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="20" y1="240" x2="255" y2="240" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="20" y1="255" x2="220" y2="255" stroke="#00f2fe" stroke-width="1.5"/>

      <line x1="20" y1="285" x2="110" y2="285" stroke="#00f2fe" stroke-width="2.5"/>
      <line x1="20" y1="305" x2="250" y2="305" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="20" y1="320" x2="240" y2="320" stroke="#00f2fe" stroke-width="1.5"/>
      <line x1="20" y1="335" x2="260" y2="335" stroke="#00f2fe" stroke-width="1.5"/>

      <line x1="20" y1="365" x2="100" y2="365" stroke="#00f2fe" stroke-width="2.5"/>
      <line x1="20" y1="385" x2="180" y2="385" stroke="#00f2fe" stroke-width="1.5"/>
    </g>

    <!-- Checkmarks -->
    <g stroke="#00d2c4" stroke-width="2.5" fill="none" opacity="0.8">
      <path d="M 265,125 L 272,135 L 285,115"/>
      <path d="M 265,205 L 272,215 L 285,195"/>
      <path d="M 265,300 L 272,310 L 285,290"/>
    </g>
  </g>

  <!-- Floating keywords -->
  <g opacity="0.6" fill="#00f2fe" font-size="14" font-family="Space Grotesk, sans-serif">
    <text x="200" y="250">ATS Optimized</text>
    <text x="850" y="320">Keywords</text>
    <text x="180" y="550">Professional</text>
    <text x="920" y="480">CAR Framework</text>
  </g>

  <!-- Decorative elements -->
  <g opacity="0.1" stroke="#00f2fe" fill="none">
    <circle cx="150" cy="200" r="35" stroke-width="1.5"/>
    <rect x="950" y="600" width="80" height="80" rx="6" stroke-width="1.5"/>
  </g>
</svg>

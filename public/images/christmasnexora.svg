<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" fill="none">
  <defs>
    <!-- Background Gradient: Deep Christmas Night -->
    <linearGradient id="xmasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="45%" stop-color="#122B52"/>
      <stop offset="100%" stop-color="#1A3A6B"/>
    </linearGradient>

    <!-- Subtle Snowfall Dot Pattern -->
    <pattern id="snowDots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#FFFFFF" opacity="0.18"/>
      <circle cx="30" cy="32" r="1.2" fill="#FFFFFF" opacity="0.12"/>
      <circle cx="42" cy="12" r="0.9" fill="#FFFFFF" opacity="0.15"/>
      <circle cx="18" cy="40" r="1.4" fill="#FFFFFF" opacity="0.10"/>
    </pattern>

    <!-- Warm Glow from ornaments area -->
    <radialGradient id="warmGlow" cx="75%" cy="55%" r="50%" fx="75%" fy="55%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FF6B35" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B1D3A" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Orange Gradient -->
    <linearGradient id="brandOrangeX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F88237"/>
      <stop offset="100%" stop-color="#E25514"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGradX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <!-- Christmas Green -->
    <linearGradient id="xmasGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>

    <!-- Christmas Red -->
    <linearGradient id="xmasRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>

    <!-- Star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFD54F" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#FFB300" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>

    <!-- Ornament Shine -->
    <radialGradient id="ornShineRed" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF8A80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C62828"/>
    </radialGradient>
    <radialGradient id="ornShineGold" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFF8E1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </radialGradient>
    <radialGradient id="ornShineBlue" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#90CAF9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </radialGradient>
    <radialGradient id="ornShineGreen" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#A5D6A7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>

    <!-- Reusable 4-pointed Sparkle -->
    <g id="xmasStar">
      <path d="M0 -10 Q0 -1.5 8.5 0 Q0 1.5 0 10 Q0 1.5 -8.5 0 Q0 -1.5 0 -10 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>
  </defs>

  <!-- ======== BACKGROUND ======== -->
  <rect width="1440" height="560" rx="26" fill="url(#xmasBg)"/>
  <rect width="1440" height="560" rx="26" fill="url(#snowDots)"/>
  <rect width="1440" height="560" rx="26" fill="url(#warmGlow)"/>

  <!-- Subtle bottom snow drift -->
  <path d="M0 520 Q120 490 280 510 Q440 530 600 505 Q760 480 920 510 Q1080 535 1240 505 Q1360 490 1440 515 L1440 560 L0 560 Z" fill="#FFFFFF" opacity="0.08"/>
  <path d="M0 540 Q180 515 360 535 Q540 550 720 525 Q900 505 1080 535 Q1260 550 1440 530 L1440 560 L0 560 Z" fill="#FFFFFF" opacity="0.05"/>

  <!-- ======== CHRISTMAS TREE ======== -->
  <g transform="translate(1100, 80)">
    <!-- Tree Shadow -->
    <ellipse cx="0" cy="420" rx="120" ry="18" fill="#000000" opacity="0.2"/>

    <!-- Tree Trunk -->
    <rect x="-18" y="380" width="36" height="50" rx="4" fill="#5D4037"/>
    <rect x="-12" y="385" width="8" height="40" rx="2" fill="#6D4C41" opacity="0.5"/>

    <!-- Tree Layers (bottom to top) -->
    <!-- Bottom layer -->
    <path d="M0 180 L-130 390 L130 390 Z" fill="url(#xmasGreen)"/>
    <path d="M0 180 L-130 390 L-115 390 L0 200 L115 390 L130 390 Z" fill="#388E3C" opacity="0.4"/>

    <!-- Middle layer -->
    <path d="M0 120 L-100 300 L100 300 Z" fill="url(#xmasGreen)"/>
    <path d="M0 120 L-100 300 L-85 300 L0 140 L85 300 L100 300 Z" fill="#388E3C" opacity="0.4"/>

    <!-- Top layer -->
    <path d="M0 50 L-70 210 L70 210 Z" fill="url(#xmasGreen)"/>
    <path d="M0 50 L-70 210 L-58 210 L0 70 L58 210 L70 210 Z" fill="#388E3C" opacity="0.4"/>

    <!-- Snow on branches -->
    <path d="M-60 210 Q-30 195 0 205 Q30 195 60 210" fill="#FFFFFF" opacity="0.35"/>
    <path d="M-90 300 Q-45 280 0 295 Q45 280 90 300" fill="#FFFFFF" opacity="0.3"/>
    <path d="M-120 390 Q-60 370 0 385 Q60 370 120 390" fill="#FFFFFF" opacity="0.25"/>

    <!-- Star on top -->
    <circle cx="0" cy="38" r="35" fill="url(#starGlow)"/>
    <path d="M0 15 L6 32 L24 32 L10 43 L15 60 L0 50 L-15 60 L-10 43 L-24 32 L-6 32 Z" fill="#FFD54F"/>
    <path d="M0 22 L4 34 L16 34 L6 42 L10 53 L0 46 L-10 53 L-6 42 L-16 34 L-4 34 Z" fill="#FFF9C4"/>

    <!-- Ornament Baubles -->
    <!-- Red baubles -->
    <circle cx="-55" cy="250" r="12" fill="url(#ornShineRed)"/>
    <circle cx="-55" cy="250" r="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="-57" y="236" width="4" height="6" rx="1" fill="#FFD54F"/>

    <circle cx="40" cy="340" r="14" fill="url(#ornShineRed)"/>
    <circle cx="36" cy="335" r="3.5" fill="#FFFFFF" opacity="0.5"/>
    <rect x="38" y="324" width="4" height="6" rx="1" fill="#FFD54F"/>

    <circle cx="-85" cy="360" r="11" fill="url(#ornShineRed)"/>
    <circle cx="-88" cy="356" r="2.5" fill="#FFFFFF" opacity="0.5"/>

    <!-- Gold baubles -->
    <circle cx="55" cy="260" r="13" fill="url(#ornShineGold)"/>
    <circle cx="51" cy="255" r="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="53" y="245" width="4" height="6" rx="1" fill="#8D6E63"/>

    <circle cx="-30" cy="350" r="10" fill="url(#ornShineGold)"/>
    <circle cx="-33" cy="346" r="2.5" fill="#FFFFFF" opacity="0.5"/>

    <!-- Blue baubles -->
    <circle cx="-20" cy="270" r="11" fill="url(#ornShineBlue)"/>
    <circle cx="-23" cy="266" r="2.8" fill="#FFFFFF" opacity="0.5"/>
    <rect x="-22" y="257" width="4" height="6" rx="1" fill="#FFD54F"/>

    <circle cx="85" cy="355" r="12" fill="url(#ornShineBlue)"/>
    <circle cx="81" cy="350" r="3" fill="#FFFFFF" opacity="0.5"/>

    <!-- Green baubles -->
    <circle cx="20" cy="230" r="10" fill="url(#ornShineGreen)"/>
    <circle cx="17" cy="226" r="2.5" fill="#FFFFFF" opacity="0.5"/>

    <!-- Tinsel / Garland strings -->
    <path d="M-50 220 Q-20 240 10 225 Q40 210 65 230" stroke="#FFD54F" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M-80 310 Q-40 330 0 315 Q40 300 80 320" stroke="#FFD54F" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M-110 380 Q-55 400 0 385 Q55 370 110 390" stroke="#FFD54F" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Small candy canes on tree -->
    <g transform="translate(-40, 290) rotate(-15)">
      <rect x="-2" y="-14" width="4" height="18" rx="2" fill="#FFFFFF"/>
      <rect x="-2" y="-14" width="4" height="4" rx="1" fill="#E53935"/>
      <rect x="-2" y="-4" width="4" height="4" rx="1" fill="#E53935"/>
    </g>
    <g transform="translate(65, 300) rotate(20)">
      <rect x="-2" y="-14" width="4" height="18" rx="2" fill="#FFFFFF"/>
      <rect x="-2" y="-14" width="4" height="4" rx="1" fill="#E53935"/>
      <rect x="-2" y="-4" width="4" height="4" rx="1" fill="#E53935"/>
    </g>
  </g>

  <!-- ======== GIFT BOXES ======== -->
  <!-- Gift Box 1 (large, red) -->
  <g transform="translate(880, 420)">
    <rect x="-45" y="-40" width="90" height="80" rx="6" fill="url(#xmasRed)"/>
    <rect x="-5" y="-40" width="10" height="80" fill="#FFD54F"/>
    <rect x="-45" y="-8" width="90" height="10" fill="#FFD54F"/>
    <!-- Bow -->
    <ellipse cx="-12" cy="-40" rx="14" ry="10" fill="#FFD54F"/>
    <ellipse cx="12" cy="-40" rx="14" ry="10" fill="#FFECB3"/>
    <circle cx="0" cy="-40" r="6" fill="#F9A825"/>
  </g>

  <!-- Gift Box 2 (small, green) -->
  <g transform="translate(800, 450)">
    <rect x="-30" y="-30" width="60" height="60" rx="5" fill="url(#xmasGreen)"/>
    <rect x="-3" y="-30" width="6" height="60" fill="#E53935"/>
    <rect x="-30" y="-5" width="60" height="6" fill="#E53935"/>
    <!-- Bow -->
    <ellipse cx="-8" cy="-30" rx="10" ry="7" fill="#E53935"/>
    <ellipse cx="8" cy="-30" rx="10" ry="7" fill="#EF5350"/>
    <circle cx="0" cy="-30" r="4" fill="#B71C1C"/>
  </g>

  <!-- Gift Box 3 (small, gold) -->
  <g transform="translate(960, 460)">
    <rect x="-25" y="-22" width="50" height="44" rx="4" fill="url(#goldGradX)"/>
    <rect x="-3" y="-22" width="6" height="44" fill="#FFFFFF"/>
    <rect x="-25" y="-4" width="50" height="6" fill="#FFFFFF"/>
    <!-- Bow -->
    <ellipse cx="-7" cy="-22" rx="9" ry="6" fill="#FFFFFF"/>
    <ellipse cx="7" cy="-22" rx="9" ry="6" fill="#FFF8E1"/>
    <circle cx="0" cy="-22" r="3.5" fill="#F5F5F5"/>
  </g>

  <!-- ======== SNOWFLAKES ======== -->
  <!-- Large snowflake -->
  <g transform="translate(750, 120)" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.3">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="-19" y1="-11" x2="19" y2="11"/>
    <line x1="-19" y1="11" x2="19" y2="-11"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" opacity="0.2"/>
    <line x1="0" y1="-16" x2="-5" y2="-20"/>
    <line x1="0" y1="-16" x2="5" y2="-20"/>
    <line x1="0" y1="16" x2="-5" y2="20"/>
    <line x1="0" y1="16" x2="5" y2="20"/>
  </g>

  <g transform="translate(1350, 90) scale(0.8)" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.25">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="-19" y1="-11" x2="19" y2="11"/>
    <line x1="-19" y1="11" x2="19" y2="-11"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <g transform="translate(680, 350) scale(0.6)" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="-19" y1="-11" x2="19" y2="11"/>
    <line x1="-19" y1="11" x2="19" y2="-11"/>
  </g>

  <!-- ======== SPARKLE STARS ======== -->
  <use href="#xmasStar" x="820" y="200" transform="translate(820 200) scale(0.9) translate(-820 -200)"/>
  <use href="#xmasStar" x="1300" y="180" transform="translate(1300 180) scale(1.1) translate(-1300 -180)"/>
  <use href="#xmasStar" x="920" y="100" transform="translate(920 100) scale(0.7) translate(-920 -100)"/>
  <use href="#xmasStar" x="1380" y="300" transform="translate(1380 300) scale(0.85) translate(-1380 -300)"/>
  <use href="#xmasStar" x="750" y="450" transform="translate(750 450) scale(0.65) translate(-750 -450)"/>

  <!-- Floating snow particles -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="100" cy="80" r="2"/>
    <circle cx="250" cy="150" r="1.5"/>
    <circle cx="400" cy="60" r="2.2"/>
    <circle cx="550" cy="200" r="1.8"/>
    <circle cx="700" cy="100" r="2"/>
    <circle cx="850" cy="50" r="1.5"/>
    <circle cx="1000" cy="160" r="2"/>
    <circle cx="1150" cy="80" r="1.8"/>
    <circle cx="1300" cy="130" r="2.2"/>
    <circle cx="200" cy="300" r="1.4"/>
    <circle cx="500" cy="350" r="1.6"/>
    <circle cx="650" cy="250" r="1.2"/>
    <circle cx="350" cy="450" r="1.8"/>
    <circle cx="150" cy="480" r="1.5"/>
    <circle cx="480" cy="500" r="1.3"/>
    <circle cx="1400" y="400" r="1.6"/>
  </g>

  <!-- ======== HOLLY & BERRIES (top-right corner accent) ======== -->
  <g transform="translate(1380, 40)">
    <!-- Holly leaves -->
    <path d="M-30 -5 Q-20 -18 -5 -10 Q5 -20 15 -8 Q10 0 15 10 Q5 20 -5 12 Q-18 18 -30 5 Z" fill="#2E7D32" opacity="0.7"/>
    <path d="M-25 0 Q-15 -12 0 -6 Q8 -14 18 -4 Q14 3 18 12 Q8 18 0 10 Q-13 14 -25 5 Z" fill="#388E3C" opacity="0.6"/>
    <!-- Berries -->
    <circle cx="-5" cy="2" r="5" fill="#C62828"/>
    <circle cx="4" cy="-3" r="4.5" fill="#D32F2F"/>
    <circle cx="-2" cy="10" r="4" fill="#C62828"/>
    <circle cx="-5" cy="2" r="1.5" fill="#EF9A9A" opacity="0.5"/>
    <circle cx="4" cy="-3" r="1.2" fill="#EF9A9A" opacity="0.5"/>
  </g>

  <!-- ======== BRANDING, TYPOGRAPHY & CTA ======== -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Brand Wordmark -->
    <text x="92" y="116" font-size="27" font-weight="700" letter-spacing="5" fill="#FFFFFF">NEX<tspan fill="#F26A21">O</tspan>RA</text>
    <text x="94" y="140" font-size="10" letter-spacing="4.8" fill="#94A3B8">STAFFING LLP</text>
    <path d="M94 168H174" stroke="#F26A21" stroke-width="3"/>

    <!-- Festive Eyebrow Pill Badge -->
    <rect x="94" y="190" width="225" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="#F26A21" stroke-width="1.2"/>
    <text x="110" y="209" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#F26A21">🎄 SEASON OF GIVING</text>

    <!-- Main Headings -->
    <text x="92" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#FFFFFF">CHRISTMAS</text>
    <text x="96" y="338" font-size="44" font-weight="700" letter-spacing="11" fill="#F26A21">SPECIAL OFFERS</text>

    <!-- Subtitles -->
    <text x="98" y="380" font-size="20" font-weight="500" fill="#94A3B8">Unwrap new career possibilities this holiday season.</text>
    <text x="98" y="408" font-size="20" font-weight="500" fill="#94A3B8">Celebrate Christmas with exclusive savings on career plans.</text>

    <!-- CTA Button (matches clickable overlay: x=96, y=427, w=242, h=58) -->
    <rect x="96" y="427" width="242" height="58" rx="29" fill="#F26A21"/>
    <text x="128" y="463" font-size="16" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">EXPLORE OFFERS</text>
    <!-- Arrow -->
    <path d="M303 456H321M314 449L321 456L314 463" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Brand Tagline -->
    <text x="98" y="530" font-size="12" letter-spacing="2" fill="#536878">PEOPLE • TRUST • GROWTH</text>
  </g>
</svg>

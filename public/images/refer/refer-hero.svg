<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-refer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1524;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="refer-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2c4;stop-opacity:1" />
    </linearGradient>
    <filter id="refer-glow">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg-refer)"/>

  <!-- Grid -->
  <g opacity="0.06">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300 M0 400 L1200 400 M0 500 L1200 500" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- Glows -->
  <circle cx="400" cy="300" r="180" fill="#00f2fe" opacity="0.05" filter="url(#refer-glow)"/>
  <circle cx="800" cy="300" r="180" fill="#00d2c4" opacity="0.05" filter="url(#refer-glow)"/>

  <!-- Network of people -->
  <g transform="translate(600, 300)">
    <!-- Central person -->
    <circle cx="0" cy="0" r="40" fill="url(#refer-gradient)" filter="url(#refer-glow)"/>
    <circle cx="0" cy="0" r="35" fill="#121623"/>

    <!-- Connected people -->
    <g opacity="0.8">
      <!-- Top -->
      <circle cx="0" cy="-120" r="28" fill="#00f2fe"/>
      <circle cx="0" cy="-120" r="24" fill="#121623"/>
      <line x1="0" y1="-40" x2="0" y2="-92" stroke="url(#refer-gradient)" stroke-width="2"/>

      <!-- Right -->
      <circle cx="120" cy="0" r="28" fill="#00d2c4"/>
      <circle cx="120" cy="0" r="24" fill="#121623"/>
      <line x1="40" y1="0" x2="92" y2="0" stroke="url(#refer-gradient)" stroke-width="2"/>

      <!-- Left -->
      <circle cx="-120" cy="0" r="28" fill="#00f2fe"/>
      <circle cx="-120" cy="0" r="24" fill="#121623"/>
      <line x1="-40" y1="0" x2="-92" y2="0" stroke="url(#refer-gradient)" stroke-width="2"/>

      <!-- Bottom Right -->
      <circle cx="85" cy="85" r="28" fill="#00d2c4"/>
      <circle cx="85" cy="85" r="24" fill="#121623"/>
      <line x1="28" y1="28" x2="65" y2="65" stroke="url(#refer-gradient)" stroke-width="2"/>

      <!-- Bottom Left -->
      <circle cx="-85" cy="85" r="28" fill="#00f2fe"/>
      <circle cx="-85" cy="85" r="24" fill="#121623"/>
      <line x1="-28" y1="28" x2="-65" y2="65" stroke="url(#refer-gradient)" stroke-width="2"/>
    </g>
  </g>

  <!-- Dollar signs -->
  <g fill="url(#refer-gradient)" font-size="32" font-weight="bold" font-family="Space Grotesk, sans-serif" opacity="0.4">
    <text x="250" y="180">$</text>
    <text x="920" y="450">$</text>
    <text x="280" y="480">$</text>
  </g>
</svg>

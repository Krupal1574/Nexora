<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-contact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1422;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="message-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2c4;stop-opacity:1" />
    </linearGradient>
    <filter id="contact-glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg-contact)"/>

  <!-- Grid -->
  <g opacity="0.06">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300 M0 400 L1200 400 M0 500 L1200 500" stroke="#00f2fe" stroke-width="0.5"/>
    <path d="M200 0 L200 600 M400 0 L400 600 M600 0 L600 600 M800 0 L800 600 M1000 0 L1000 600" stroke="#00f2fe" stroke-width="0.5"/>
  </g>

  <!-- Glow -->
  <circle cx="600" cy="300" r="250" fill="#00f2fe" opacity="0.06" filter="url(#contact-glow)"/>

  <!-- Message/Email icon -->
  <g transform="translate(600, 300)">
    <!-- Envelope -->
    <rect x="-120" y="-70" width="240" height="140" rx="8" fill="#121623" stroke="url(#message-gradient)" stroke-width="3" filter="url(#contact-glow)"/>
    <rect x="-115" y="-65" width="230" height="130" rx="6" fill="#00f2fe" opacity="0.03"/>

    <!-- Envelope flap -->
    <path d="M -120,-70 L 0,30 L 120,-70" stroke="url(#message-gradient)" stroke-width="3" fill="none"/>
    <path d="M -120,-70 L 0,20 L 120,-70" fill="url(#message-gradient)" opacity="0.2"/>

    <!-- Paper inside -->
    <g opacity="0.3">
      <line x1="-80" y1="-20" x2="80" y2="-20" stroke="#00f2fe" stroke-width="2"/>
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#00f2fe" stroke-width="2"/>
      <line x1="-80" y1="20" x2="50" y2="20" stroke="#00f2fe" stroke-width="2"/>
    </g>
  </g>

  <!-- Floating message bubbles -->
  <g opacity="0.15" stroke="#00f2fe" stroke-width="2" fill="none">
    <circle cx="300" cy="200" r="35"/>
    <circle cx="900" cy="250" r="40"/>
    <rect x="250" y="450" width="100" height="70" rx="35"/>
  </g>

  <!-- Connection lines -->
  <g opacity="0.2" stroke="url(#message-gradient)" stroke-width="1.5" stroke-dasharray="5,5">
    <path d="M 335,210 L 480,260"/>
    <path d="M 865,270 L 720,290"/>
  </g>
</svg>
